services:
  api:
    build:
      context: ..
      dockerfile: config/docker/api.Dockerfile
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DATABASE_PATH: /data/worklog.db
    volumes:
      - worklog-db:/data
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: config/docker/web.Dockerfile
      args:
        VITE_API_URL: http://localhost:3001
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  worklog-db:
